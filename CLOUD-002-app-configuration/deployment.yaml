apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-web
  namespace: development

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-web

  template:
    metadata:
      labels:
        app: app-web

    spec:
      containers:
        - name: nginx
          image: nginx:1.28

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
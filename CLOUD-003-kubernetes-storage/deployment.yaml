apiVersion: apps/v1
kind: Deployment

metadata:
  name: storage-app
  namespace: storage-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: storage-app

  template:
    metadata:
      labels:
        app: storage-app

    spec:
      containers:
        - name: nginx
          image: nginx:1.28

          ports:
            - containerPort: 80

          volumeMounts:
            - name: persistent-storage
              mountPath: /usr/share/nginx/html

      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: app-storage